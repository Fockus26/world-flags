# PR de versión con Changesets (D135–D136).
#
# Los PRs de trabajo no tocan `version`, CHANGELOG.md ni `APP_VERSION` de public/sw.js:
# cada uno con cambio visible trae un `.changeset/<desc>.md` (formato en .changeset/README.md).
# Al llegar a main, esta Action abre (o actualiza) un único PR "chore(release): versión" que
# corre scripts/release.ts: junta los changesets en la entrada nueva del CHANGELOG (la que
# muestra "Novedades"), sube `version` y `APP_VERSION`. El dueño lo mergea cuando quiere
# publicar; ningún agente lo edita ni lo mergea.
#
# Una vez por repo, en GitHub: Settings › Actions › General › "Allow GitHub Actions to
# create and approve pull requests". Sin eso la Action falla al abrir el PR.
#
# Un PR abierto con GITHUB_TOKEN no dispara `pull_request` (GitHub lo impide para evitar
# bucles), así que el CI no correría y el check `ci` que exige `main` quedaría pendiente.
# `workflow_dispatch` es la excepción: el último paso lanza ci.yml sobre la rama del PR y su
# check `ci` queda en el commit que pide la protección. Necesita `workflow_dispatch` en ci.yml.
# El PR solo cambia package.json, CHANGELOG.md, public/sw.js y borra los changesets.
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  actions: write # para lanzar ci.yml sobre el PR de versión

jobs:
  version-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Sin `publish-script`: la app no se publica en npm, solo se versiona.
      # scripts/release.ts corre `changeset version` (con `--bun`: Changesets 3 pide
      # Node ≥ 22.11) y después escribe CHANGELOG.md y public/sw.js.
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: bun scripts/release.ts
          pr-title: "chore(release): versión"
          commit-message: "chore(release): versión"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rama que usa changesets/action para el PR: changeset-release/<rama base>.
      - name: CI del PR de versión
        if: steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref changeset-release/${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
